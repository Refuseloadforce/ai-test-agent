name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行自测
        run: python tests/selftest.py
